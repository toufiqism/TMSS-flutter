# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  # `flutter build ios` clones every Swift Package *and* copies each plugin's own Dart
  # sources into build/ios/SourcePackages. Those carry their own tests, written against
  # other packages' versions of mockito and friends, and they land in `flutter analyze`
  # as ~120 errors in code this repo does not own — enough noise to hide a real finding.
  # Nothing under build/ is ours; it is regenerated on every build.
  exclude:
    - build/**
  # Strict modes close the holes `dynamic` otherwise punches through the type
  # system. This matters most in data/remote/dto/, where every value arrives as
  # `dynamic` off a decoded JSON map: without strict-casts an accidental
  # `json['id'] as String` type-checks at compile time and throws at runtime on
  # the first server that returns an int (which this contract explicitly allows
  # for RequisitionId).
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # An un-awaited future in a notifier silently swallows repository errors.
    unawaited_futures: error

linter:
  rules:
    - avoid_dynamic_calls
    - unawaited_futures
