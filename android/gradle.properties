org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project lives on K:\ while the pub cache (and therefore plugin Kotlin
# sources) lives on C:\. Kotlin's incremental compiler relativizes every source
# path against the project root and throws
# "this and base files have different roots" when they sit on different Windows
# drives, failing :<plugin>:compileReleaseKotlin. Non-incremental compilation
# skips that path-relativization entirely.
kotlin.incremental=false
